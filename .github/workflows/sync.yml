name: Auto Sync Upstream Mirror (Universal Smart Check)

on:
  schedule:
    # 每天凌晨 2:15 自動執行 (北京時間 10:15)
    - cron: '15 2 * * *'
  workflow_dispatch: # 允許手動點擊按鈕觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 正常拉取本地倉庫環境
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Check and Sync
        run: |
          # ==================== 以後換新倉庫只需改下面這兩行 ====================
          UPSTREAM_OWNER="chengege666"      # 原作者的 GitHub 使用者名稱
          REPO_NAME="OpenWrt-APK"           # 倉庫的準確名稱
          # ====================================================================
          
          # 1. 獲取上游原作者最新的 Commit ID
          UPSTREAM_COMMIT=$(git ls-remote https://github.com/${UPSTREAM_OWNER}/${REPO_NAME}.git refs/heads/main | awk '{print $1}')
          
          # 2. 讀取本地上次記錄的上游 Commit ID（若檔案不存在則為空）
          LAST_SYNCED_COMMIT=""
          if [ -f .upstream_commit ]; then
            LAST_SYNCED_COMMIT=$(cat .upstream_commit)
          fi
          
          echo "Upstream latest commit: $UPSTREAM_COMMIT"
          echo "Last synced commit:     $LAST_SYNCED_COMMIT"
          
          # 3. 核心比對邏輯：如果上游 ID 與上次同步的一致，說明原作者沒任何新修改，直接退出
          if [ -n "$UPSTREAM_COMMIT" ] && [ "$UPSTREAM_COMMIT" = "$LAST_SYNCED_COMMIT" ]; then
            echo "[提示] 上游原作者沒有新修改，無需同步。退出。"
            exit 0
          fi
          
          echo "[檢測到更新] 原作者發布了新代碼，開始執行原生覆蓋同步..."
          
          # 4. 把當前正在運行的這個 sync.yml 備份到系統臨時目錄 /tmp 中
          cp .github/workflows/sync.yml /tmp/sync.yml
          
          # 5. 原生 Git 操作：添加上游源並精準拉取最新的一層歷史
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${REPO_NAME}.git
          git fetch upstream main --depth=1
          
          # 6. 強制重置，將本地目錄還原成上游狀態
          git reset --hard upstream/main
          
          # 7. 把備份的工作流放回原位，並記錄本次同步的上游 Commit ID
          mkdir -p .github/workflows
          cp /tmp/sync.yml .github/workflows/sync.yml
          echo "$UPSTREAM_COMMIT" > .upstream_commit
          
          # 8. 重新綁定憑證並強推回你自己的 main 分支
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          git add .github/workflows/sync.yml .upstream_commit
          git commit -m "chore: sync upstream [${UPSTREAM_COMMIT:0:7}] and retain local workflow" || true
          
          git push origin HEAD:main --force
          echo "[成功] 已成功完成上游全量覆蓋，並已記錄最新 Commit ID！"
